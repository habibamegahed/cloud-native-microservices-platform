name: Manual CI/CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod

      namespace:
        description: "Kubernetes namespace"
        required: true
        type: choice
        default: sock-shop
        options:
          - sock-shop
          - habiba-dev
          - cloudnova

      action:
        description: "What do you want to run?"
        required: true
        type: choice
        default: deploy
        options:
          - plan
          - deploy
          - destroy

      apply_terraform:
        description: "Run Terraform?"
        required: true
        type: boolean
        default: false

      aws_region:
        description: "AWS region for EKS and AWS CLI"
        required: false
        type: string
        default: us-east-1